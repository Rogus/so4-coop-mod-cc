; so4coop co-op 1.4 - settings / configuracoes
;
; Steam controller number -> party position (0 = first member, 1 = second, 2 = third, 3 = fourth)
; Numero do controle no Steam -> posicao no grupo (0 = primeiro membro, 1 = segundo ...)
steam1_position=0
steam2_position=1
steam3_position=2
steam4_position=3
;
; Co-op in battle: each player's character is driven by their own controller (time-sliced leader).
; Co-op na batalha: o personagem de cada jogador e guiado pelo proprio controle (lider em fatias de tempo).
coop_auto=1
coop_slice_ms=40
coop_idle_ms=1500
coop_active_only=1
;
; Steady display during co-op: the mini-map, sight cursor and target board follow one character
; instead of flickering between the players (0 = off). coop_display_pos=P picks the character
; (default: the lowest steamN_position).
; Exibicao estavel no co-op: minimapa, cursor de mira e quadro de alvo seguem um personagem so,
; sem piscar entre os jogadores (0 = desligado). coop_display_pos=P escolhe qual (padrao: a menor
; steamN_position).
coop_display_fix=1
;
; Needed for co-op / necessario para o co-op (each controller only reaches its own character)
hook_steam=1
leader_only_input=1
;
; R3 (Steam action 10): make your character the leader (tag-team, used when coop_auto=0)
take_action=10
activate_all=0
;
; PlayStation button prompts: Special K texture packs in SK_Res\inject\textures (0 = off)
; Icones do PlayStation: pacotes de textura do Special K em SK_Res\inject\textures (0 = desligado)
tex_hook=1
