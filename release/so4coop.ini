; so4coop tag-team 1.1 - settings / configuracoes
; R3 (Steam action 10) on a controller makes that controller's character the battle leader.
; R3 (acao 10 do Steam) num controle torna o personagem desse controle o lider da batalha.
take_action=10
; Steam controller number -> party position (0 = first member, 1 = second, 2 = third, 3 = fourth)
; Numero do controle no Steam -> posicao no grupo (0 = primeiro membro, 1 = segundo ...)
steam1_position=0
steam2_position=1
steam3_position=2
activate_all=0
; 1.1: in battle only the leader's controller moves the leader (0 = all controllers, as in 1.0)
; 1.1: na batalha so o controle do lider move o lider (0 = todos os controles, como na 1.0)
hook_steam=1
leader_only_input=1
